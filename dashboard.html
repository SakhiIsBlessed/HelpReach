<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — HelpReach</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>.card-compact{box-shadow:0 6px 18px rgba(0,0,0,.05);border-radius:8px}</style>
  </head>
  <body>
    <div class="container" style="margin-top:80px;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Your Dashboard</h2>
        <div>
          <a class="btn btn-outline-secondary me-2" href="listings.html">Active donations</a>
          <a class="btn btn-primary" href="donate.html">Donate</a>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-6">
          <h5>Donor — Your posted donations</h5>
          <div id="donorArea"></div>
        </div>
        <div class="col-lg-6">
          <h5>NGO — Your claimed donations</h5>
          <div id="ngoArea"></div>
        </div>
      </div>
    </div>

    <script>
      function render(){
        const list = JSON.parse(localStorage.getItem('donations')||'[]');
        const donorArea = document.getElementById('donorArea'); donorArea.innerHTML='';
        const ngoArea = document.getElementById('ngoArea'); ngoArea.innerHTML='';
        if(!list.length){ donorArea.innerHTML='<div class="alert alert-info">No donations posted.</div>'; ngoArea.innerHTML='<div class="alert alert-info">No claims yet.</div>'; return; }
        list.forEach(d=>{
          const card = document.createElement('div'); card.className='card p-3 mb-2 card-compact';
          card.innerHTML = `<div class="d-flex justify-content-between align-items-start"><div><h6>${d.type} <small class="text-muted">(${d.quantity})</small></h6><p class="small mb-1">${d.address}</p><p class="mb-0"><strong>Status:</strong> ${d.status}</p></div><div class="text-end"></div></div>`;
          // Donor view: show edit/cancel when owner (we don't have users, so show all)
          const donorActions = document.createElement('div'); donorActions.className='mt-2';
          donorActions.innerHTML = `<button class="btn btn-sm btn-outline-primary me-2" onclick="edit(${d.id})">Edit</button><button class="btn btn-sm btn-danger" onclick="cancel(${d.id})">Cancel</button>`;
          card.appendChild(donorActions);
          donorArea.appendChild(card.cloneNode(true));

          // NGO area: show claimed items only
          if (d.status==='Fully Assigned' || d.status==='Split Between 2 NGOs'){
            const ngoCard = document.createElement('div'); ngoCard.className='card p-3 mb-2 card-compact';
            ngoCard.innerHTML = `<div class="d-flex justify-content-between align-items-start"><div><h6>${d.type} <small class="text-muted">(${d.quantity})</small></h6><p class="small mb-1">${d.address}</p><p class="mb-0"><strong>Status:</strong> ${d.status}</p></div><div class="text-end"><button class="btn btn-sm btn-success" onclick="markDelivered(${d.id})">Mark Delivered</button></div></div>`;
            ngoArea.appendChild(ngoCard);
          }
        });
      }
      function edit(id){ alert('Edit not implemented in this prototype.'); }
      function cancel(id){
        let list = JSON.parse(localStorage.getItem('donations')||'[]');
        list = list.filter(x=>x.id!==id);
        localStorage.setItem('donations', JSON.stringify(list));
        render();
      }
      function markDelivered(id){
        let list = JSON.parse(localStorage.getItem('donations')||'[]');
        const idx = list.findIndex(x=>x.id===id); if (idx===-1) return;
        list[idx].status = 'Delivered';
        localStorage.setItem('donations', JSON.stringify(list));
        render();
      }
      render();
    </script>
  </body>
</html>
